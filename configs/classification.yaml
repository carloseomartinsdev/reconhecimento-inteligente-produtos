# Valores iniciais planejados para a fase experimental.
# Ainda não foram ajustados nem avaliados.

classification:
  image_size: 224
  pretrained_imagenet: false
  architectures:
    mobilenet_v3_large:
      model_id: A
      description: "MobileNetV3-Large para classificação de um produto por imagem."
    resnet18:
      model_id: B
      description: "ResNet18 como classificador de comparação, com o mesmo protocolo do Modelo A."
  batch_size:
    cpu: 8
    gpu: 32
  optimizer:
    name: AdamW
    learning_rate: 0.0003
    weight_decay: 0.0001
  schedule:
    max_epochs: 20
    early_stopping_patience: 5
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  preprocessing_presets:
    - baseline_imagenet
    - letterbox
    - clahe
    - equalize
    - identity_scale
